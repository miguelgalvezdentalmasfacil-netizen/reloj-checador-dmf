<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reloj Checador · Dental Más Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Variables Minimalistas */
  :root {
    --bg-color: #F8FAFC;
    --surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --text-light: #94A3B8;
    --border: #F1F5F9;
    --border-dark: #E2E8F0;
    --primary: #0F172A; 
    --primary-hover: #1E293B;
    --teal: #0D9488;
    --green: #10B981;
    --red: #EF4444;
    --radius-lg: 24px;
    --radius-md: 12px; 
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.02);
    --hover-bg: #F8FAFC;
  }

  /* Tema Oscuro Minimalista */
  body.dark-theme {
    --bg-color: #0B1120;
    --surface: #0F172A;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-light: #64748B;
    --border: #1E293B;
    --border-dark: #334155;
    --primary: #F8FAFC;
    --primary-hover: #E2E8F0;
    --hover-bg: #1E293B;
  }
  body.dark-theme .btn-primary { color: #0F172A; }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color 0.3s, color 0.3s;
  }
  
  svg { display: block; }
  
  /* Navbar */
  .navbar {
    background: var(--surface);
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid var(--border-dark);
    position: sticky;
    top: 0;
    z-index: 10;
    transition: background-color 0.3s, border-color 0.3s;
  }
  
  .brand { display: flex; align-items: center; }
  .brand-img { height: 45px; width: auto; object-fit: contain; }

  /* Menú de Opciones (Nav Actions) */
  .nav-actions { 
    position: relative; 
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Date Pill Minimalista */
  .date-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border: 1px solid var(--border-dark);
    border-radius: 24px; background: transparent;
    font-size: 13px; color: var(--text-main); font-weight: 500;
  }
  .dot-orange { width: 6px; height: 6px; background-color: #F59E0B; border-radius: 50%; }
  .date-text .fw-normal { font-weight: 400; color: var(--text-muted); }

  /* Custom Gear Button */
  .btn-settings-outline {
    background: transparent; border: 1px solid var(--border-dark);
    color: var(--text-muted); width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
  }
  .btn-settings-outline:hover {
    border-color: var(--text-main); color: var(--text-main);
  }
  
  /* Dropdown Menú Limpio */
  .dropdown-menu {
    position: absolute; right: 0; top: 56px; background: var(--surface);
    border: 1px solid var(--border-dark); border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft); min-width: 200px; z-index: 100;
    overflow: hidden; padding: 8px 0;
    transform-origin: top right; transition: opacity 0.2s, transform 0.2s;
  }
  .dropdown-menu.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
  
  .dropdown-header {
    padding: 8px 16px; font-size: 11px; font-weight: 500; color: var(--text-light); 
    text-transform: uppercase; letter-spacing: 1px;
  }
  .dropdown-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: none;
    background: transparent; color: var(--text-main); font-size: 13px; font-weight: 500; 
    cursor: pointer; text-align: left; font-family: inherit; transition: background 0.1s;
  }
  .dropdown-item:hover { background: var(--hover-bg); }
  .dropdown-item span { display: flex; color: var(--text-muted); }
  .dropdown-divider { height: 1px; background: var(--border-dark); margin: 8px 0; }
  .text-red { color: var(--red); }
  .text-red span { color: var(--red); }

  /* Layout */
  .container { max-width: 560px; margin: 60px auto; padding: 0 20px; }

  /* Cards Ultra Limpias */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: var(--shadow-soft);
    margin-bottom: 24px;
    transition: background-color 0.3s, border-color 0.3s;
  }

  .card-header {
    display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 32px;
  }
  .card-icon {
    color: var(--text-muted); margin-bottom: 16px;
  }
  .card-title-group h2 {
    margin: 0; font-size: 20px; font-weight: 500; color: var(--text-main); letter-spacing: -0.5px;
  }
  .card-title-group p {
    margin: 8px 0 0; font-size: 14px; font-weight: 400; color: var(--text-muted);
  }

  /* Forms Minimalistas */
  .form-group { margin-bottom: 24px; text-align: left; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px;
  }
  .form-control {
    width: 100%; padding: 14px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--border-dark); background: transparent;
    font-size: 14px; font-weight: 400; color: var(--text-main); font-family: inherit; transition: all 0.2s;
  }
  .form-control:focus { outline: none; border-color: var(--text-main); }
  
  select.form-control {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 14px center; background-size: 16px;
  }

  /* Buttons Minimalistas */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 24px; border-radius: var(--radius-md); font-weight: 500; font-size: 14px;
    cursor: pointer; transition: all 0.2s; border: none; font-family: inherit; width: 100%;
  }
  .btn-primary { background: var(--primary); color: var(--surface); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-text {
    background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 400;
    width: auto; padding: 14px 16px; border: none; cursor: pointer; font-family: inherit;
  }
  .btn-text:hover { color: var(--text-main); }

  /* Punch View Minimalista */
  .user-badge {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding-bottom: 32px; border-bottom: 1px solid var(--border-dark); margin-bottom: 32px;
  }
  .user-badge-info h1 {
    margin: 0 0 8px 0; font-size: 28px; font-weight: 300; color: var(--text-main); letter-spacing: -1px;
  }
  .user-badge-info .sucursal-tag {
    font-size: 13px; font-weight: 500; color: var(--text-muted);
  }

  .punch-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 500px) {
    .punch-grid { grid-template-columns: 1fr; }
    .navbar { padding: 0 20px; }
    .date-text .fw-normal { display: none; }
    .card { padding: 24px; }
  }

  .btn-punch {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; border-radius: var(--radius-lg); 
    border: 1px solid var(--border-dark); background: transparent;
    cursor: pointer; transition: transform 0.1s, border-color 0.2s; font-family: inherit;
  }
  .btn-punch:active { transform: scale(0.98); }
  
  .btn-punch.entrada { color: var(--text-main); }
  .btn-punch.entrada:hover { border-color: var(--green); }
  .btn-punch.entrada .punch-icon { color: var(--green); }
  
  .btn-punch.salida { color: var(--text-main); }
  .btn-punch.salida:hover { border-color: var(--red); }
  .btn-punch.salida .punch-icon { color: var(--red); }

  .punch-icon { margin-bottom: 16px; }
  .punch-label { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .punch-sub { font-size: 13px; font-weight: 400; color: var(--text-muted); }

  .status-message {
    margin-top: 32px; padding: 16px; border-radius: var(--radius-md);
    text-align: center; font-weight: 500; font-size: 14px; display: none;
  }
  .status-message.success { 
    background: transparent; color: var(--green); display: block; border: 1px solid var(--border-dark);
  }
  
  /* Utilities */
  .display-none { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <!-- Logo -->
  <div class="brand">
    <img src="logo.png" alt="Dental Más Fácil" class="brand-img">
  </div>
  
  <!-- Contenedor derecho: Fecha y Engranaje HD -->
  <div class="nav-actions">
    
    <div class="date-pill" id="datePill">
      <span class="dot-orange"></span>
      <span class="date-text"><span class="fw-normal">Hoy:</span> <span id="currentDate">Cargando...</span></span>
    </div>

    <button class="btn-settings-outline" id="btnSettings" onclick="toggleMenu()" title="Configuración">
      <!-- Icono de engranaje en SVG fino -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    
    <div id="settingsMenu" class="dropdown-menu hidden">
      <div class="dropdown-header">Opciones</div>
      <button class="dropdown-item" onclick="editarUsuario()">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
        Editar perfil
      </button>
      <button class="dropdown-item" id="btnTheme" onclick="toggleTheme()">
        <!-- El JS inyecta el SVG de luna o sol aquí -->
      </button>
      <button class="dropdown-item" onclick="mostrarAyuda()">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></span>
        Ayuda y soporte
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item text-red" onclick="cerrarSesion()">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>

<div class="container">
  
  <!-- VISTA: SETUP/EDITAR USUARIO -->
  <div id="view-setup" class="card display-none">
    <div class="card-header">
      <div class="card-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="card-title-group">
        <h2 id="setupTitle">Perfil de Empleado</h2>
        <p id="setupDesc">Configura tu perfil para poder registrar asistencias.</p>
      </div>
    </div>
    
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="inputNombre" class="form-control" placeholder="Escribe tu nombre y apellido" autocomplete="off">
    </div>
    
    <div class="form-group">
      <label>Sucursal</label>
      <select id="inputSucursal" class="form-control">
        <option value="">Selecciona una sucursal</option>
        <option value="Tijuana">Tijuana</option>
        <option value="Mexicali - Obregón">Mexicali - Obregón</option>
        <option value="Mexicali - Villa Verde">Mexicali - Villa Verde</option>
        <option value="Ensenada">Ensenada</option>
      </select>
    </div>
    
    <div style="display: flex; gap: 12px; align-items: center; margin-top: 32px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="guardarUsuario()">Guardar perfil</button>
      <button class="btn-text display-none" id="btnCancelar" onclick="cancelarEdicion()">Cancelar</button>
    </div>
  </div>


  <!-- VISTA: RELOJ CHECADOR -->
  <div id="view-punch" class="card display-none">
    <div class="user-badge">
      <div class="user-badge-info">
        <h1 id="lblNombre">Cargando...</h1>
        <div class="sucursal-tag" id="lblSucursal">Sucursal</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 32px;">
      <p style="color: var(--text-muted); font-size: 14px; font-weight: 400; margin: 0;">¿Qué deseas registrar en este momento?</p>
    </div>

    <div class="punch-grid">
      <button class="btn-punch entrada" onclick="registrar('Entrada')">
        <div class="punch-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </div>
        <div class="punch-label">Entrada</div>
        <div class="punch-sub">Al llegar a tu turno</div>
      </button>
      
      <button class="btn-punch salida" onclick="registrar('Salida')">
        <div class="punch-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </div>
        <div class="punch-label">Salida</div>
        <div class="punch-sub">Al terminar tu turno</div>
      </button>
    </div>

    <div id="msgStatus" class="status-message"></div>
  </div>

</div>

<script>
  // Variables globales
  const KEY_USER = 'dmf_emp_nombre';
  const KEY_BRANCH = 'dmf_emp_sucursal';
  const KEY_THEME = 'dmf_theme';
  
  // Iconos SVG para el switch de tema
  const sunSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  // Elementos DOM
  const viewSetup = document.getElementById('view-setup');
  const viewPunch = document.getElementById('view-punch');
  const inputNombre = document.getElementById('inputNombre');
  const inputSucursal = document.getElementById('inputSucursal');
  const lblNombre = document.getElementById('lblNombre');
  const lblSucursal = document.getElementById('lblSucursal');
  const msgStatus = document.getElementById('msgStatus');
  const settingsMenu = document.getElementById('settingsMenu');
  const btnCancelar = document.getElementById('btnCancelar');

  // Inicialización principal
  function init() {
    aplicarTema();
    actualizarFecha();

    const savedName = localStorage.getItem(KEY_USER);
    const savedBranch = localStorage.getItem(KEY_BRANCH);

    if (savedName && savedBranch) {
      lblNombre.textContent = savedName;
      lblSucursal.textContent = savedBranch;
      viewPunch.classList.remove('display-none');
      viewSetup.classList.add('display-none');
    } else {
      document.getElementById('setupTitle').textContent = "Perfil de Empleado";
      document.getElementById('setupDesc').textContent = "Configura tu perfil para poder registrar asistencias.";
      btnCancelar.classList.add('display-none'); 
      viewSetup.classList.remove('display-none');
      viewPunch.classList.add('display-none');
    }
  }
  
  function actualizarFecha() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const hoy = new Date();
    
    const nombreDia = dias[hoy.getDay()];
    const numeroDia = hoy.getDate();
    const nombreMes = meses[hoy.getMonth()];
    
    document.getElementById('currentDate').textContent = `${nombreDia}, ${numeroDia} De ${nombreMes}`;
  }

  /* ====== LÓGICA DEL MENÚ SUPERIOR ====== */
  function toggleMenu() {
    settingsMenu.classList.toggle('hidden');
  }

  // Cerrar menú si se hace clic afuera
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-actions')) {
      settingsMenu.classList.add('hidden');
    }
  });

  /* ====== TEMA OSCURO / CLARO ====== */
  function aplicarTema() {
    const isDark = localStorage.getItem(KEY_THEME) === 'dark';
    const btnTheme = document.getElementById('btnTheme');
    
    if (isDark) {
      document.body.classList.add('dark-theme');
      btnTheme.innerHTML = `<span>${sunSvg}</span> Modo claro`;
    } else {
      document.body.classList.remove('dark-theme');
      btnTheme.innerHTML = `<span>${moonSvg}</span> Modo oscuro`;
    }
  }

  function toggleTheme() {
    const isDark = document.body.classList.contains('dark-theme');
    localStorage.setItem(KEY_THEME, isDark ? 'light' : 'dark');
    aplicarTema();
    toggleMenu();
  }

  /* ====== FUNCIONES DEL PERFIL ====== */
  function guardarUsuario() {
    const nombre = inputNombre.value.trim();
    const sucursal = inputSucursal.value;

    if (!nombre) { alert("Por favor, escribe tu nombre completo."); return; }
    if (!sucursal) { alert("Por favor, selecciona una sucursal."); return; }

    localStorage.setItem(KEY_USER, nombre);
    localStorage.setItem(KEY_BRANCH, sucursal);
    
    msgStatus.className = 'status-message';
    init();
  }

  function editarUsuario() {
    inputNombre.value = localStorage.getItem(KEY_USER) || '';
    inputSucursal.value = localStorage.getItem(KEY_BRANCH) || '';
    
    document.getElementById('setupTitle').textContent = "Editar perfil";
    document.getElementById('setupDesc').textContent = "Actualiza tu nombre o cambia de sucursal.";
    
    btnCancelar.classList.remove('display-none');
    
    viewPunch.classList.add('display-none');
    viewSetup.classList.remove('display-none');
    toggleMenu();
  }

  function cancelarEdicion() {
    init();
  }

  function cerrarSesion() {
    if(confirm("¿Seguro que deseas cerrar sesión? Borrará tus datos de este dispositivo.")){
      localStorage.removeItem(KEY_USER);
      localStorage.removeItem(KEY_BRANCH);
      inputNombre.value = '';
      inputSucursal.value = '';
      msgStatus.className = 'status-message';
      init();
    }
    toggleMenu();
  }

  function mostrarAyuda() {
    alert("Soporte: Para cualquier problema con el reloj checador, contacta al administrador o a Recursos Humanos de Dental Más Fácil.");
    toggleMenu();
  }

  /* ====== LÓGICA DEL RELOJ ====== */
  function registrar(tipo) {
    const now = new Date();
    const timeString = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    
    msgStatus.textContent = `¡${tipo} registrada a las ${timeString}!`;
    msgStatus.className = 'status-message success';

    setTimeout(() => {
      msgStatus.className = 'status-message';
    }, 5000);

    // LOG PARA FUTURA INTEGRACIÓN
    console.log(`[BD] ${tipo} | Empleado: ${lblNombre.textContent} | Sucursal: ${lblSucursal.textContent} | Hora: ${timeString}`);
  }

  // Iniciar la app
  init();
</script>
