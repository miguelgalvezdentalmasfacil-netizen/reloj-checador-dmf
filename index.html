<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Reloj Checador · Dental Más Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta de colores ultra minimalista */
  :root {
    --bg-color: #F8FAFC;
    --surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --text-light: #94A3B8;
    --border: #F1F5F9;
    --border-dark: #E2E8F0;
    --primary: #0F172A;
    --primary-hover: #1E293B;
    --hover-bg: #F8FAFC;
    --radius-lg: 24px;
    --radius-md: 12px;
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.02);
  }

  /* Tema Oscuro Minimalista */
  body.dark-theme {
    --bg-color: #0B1120;
    --surface: #0F172A;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-light: #64748B;
    --border: #1E293B;
    --border-dark: #334155;
    --primary: #F8FAFC;
    --primary-hover: #E2E8F0;
    --hover-bg: #1E293B;
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s, color 0.3s;
  }
  
  svg { display: block; }

  /* Navbar Minimalista */
  .navbar {
    background: var(--surface);
    height: 80px; 
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; 
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    transition: background-color 0.3s, border-color 0.3s;
  }
  
  .brand { display: flex; align-items: center; }
  .brand-img { height: 45px; width: auto; object-fit: contain; border-radius: 12px; }

  /* Menú de Opciones (Nav Actions) */
  .nav-actions { 
    display: flex; align-items: center; gap: 16px;
  }
  .date-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-color); border: 1px solid var(--border-dark);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
    color: var(--text-muted); transition: background-color 0.3s, border-color 0.3s;
  }
  .btn-settings-outline {
    background: transparent; border: 1px solid var(--border-dark); border-radius: 50%;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .btn-settings-outline:hover { color: var(--text-main); border-color: var(--text-main); }

  /* Layout principal */
  .container { max-width: 600px; margin: 60px auto; padding: 0 20px; }
  
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 48px;
    box-shadow: var(--shadow-soft); transition: background-color 0.3s, border-color 0.3s;
  }

  /* Textos y Etiquetas */
  .user-badge {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 24px; border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .user-badge-info h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.5px; color: var(--text-main); }
  .user-badge-info p { margin: 4px 0 0; font-size: 14px; color: var(--text-muted); font-weight: 400; }

  /* Grid de Botones de Registro */
  .punch-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  
  @media (max-width: 600px) {
    body { background-color: var(--surface); }
    .navbar { padding: 0 20px; height: 70px; border-bottom: 1px solid var(--border-dark); }
    .brand-img { height: 36px; }
    .date-pill { display: none; } /* Ocultar fecha para ganar espacio */
    .btn-settings-outline { width: 36px; height: 36px; }
    
    .container { margin: 0 auto; padding: 24px 20px; max-width: 100%; }
    .card { padding: 0; border: none; box-shadow: none; background: transparent; margin-bottom: 0; }
    
    .user-badge-info h1 { font-size: 24px; }
    .punch-grid { grid-template-columns: 1fr; gap: 16px; }
    .btn-punch { padding: 24px 16px; border-width: 1.5px; }
  }

  .btn-punch {
    background: transparent; border: 1px solid var(--border-dark);
    padding: 32px 24px; border-radius: var(--radius-lg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; font-family: inherit; position: relative; overflow: hidden;
  }
  .btn-punch:hover { border-color: var(--text-main); background: var(--hover-bg); transform: translateY(-2px); }
  .btn-punch:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-punch svg { margin-bottom: 16px; color: var(--text-main); }
  .btn-punch span { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 400; }
  
  /* Botones específicos */
  .btn-entrada { color: var(--text-main); font-weight: 500; font-size: 16px; }
  .btn-entrada svg { color: #10B981; }
  .btn-salida { color: var(--text-main); font-weight: 500; font-size: 16px; }
  .btn-salida svg { color: #EF4444; }

  /* Formulario (Configuración) */
  .form-group { margin-bottom: 24px; text-align: left; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input {
    width: 100%; padding: 14px 16px; border: 1px solid var(--border-dark); border-radius: var(--radius-md);
    background: var(--bg-color); color: var(--text-main); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--text-main); }
  
  .btn-guardar {
    background: var(--primary); color: var(--bg-color); border: none; width: 100%;
    padding: 16px; border-radius: var(--radius-md); font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background-color 0.2s; font-family: inherit;
  }
  body.dark-theme .btn-guardar { color: var(--surface); }
  .btn-guardar:hover { background: var(--primary-hover); }

  /* Utilities */
  .display-none { display: none !important; }

  /* Modal Personalizado */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--surface); padding: 40px 32px;
    border-radius: var(--radius-lg); text-align: center;
    max-width: 90%; width: 400px; box-shadow: var(--shadow-soft);
    transform: translateY(20px); transition: transform 0.3s; border: 1px solid var(--border);
  }
  .modal-overlay.show .modal-card { transform: translateY(0); }
  .modal-icon {
    width: 64px; height: 64px; background: #ECFDF5; color: #10B981;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  body.dark-theme .modal-icon { background: rgba(16, 185, 129, 0.15); }
  .modal-title { font-size: 22px; font-weight: 600; margin: 0 0 12px; color: var(--text-main); }
  .modal-message { font-size: 16px; color: var(--text-muted); margin: 0 0 32px; line-height: 1.5; font-weight: 400; }
  .modal-btn {
    background: var(--text-main); color: var(--bg-color); border: none;
    padding: 16px; border-radius: var(--radius-md); font-size: 16px;
    font-weight: 600; width: 100%; cursor: pointer; transition: opacity 0.2s;
  }
  .modal-btn:hover { opacity: 0.9; }

  /* Spinners */
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="logo.png" alt="Dental Más Fácil" class="brand-img">
  </div>
  <div class="nav-actions">
    <div class="date-pill">
      <span style="width: 6px; height: 6px; background: #F59E0B; border-radius: 50%; display: block;"></span>
      <span id="fechaHoy"></span>
    </div>
    <button class="btn-settings-outline" id="btnThemeToggle" onclick="toggleTheme()" title="Cambiar tema">
      <!-- Icono inyectado por JS -->
    </button>
  </div>
</nav>

<div class="container">
  
  <div class="card">
    
    <!-- Paso 1: Configuración de Perfil (Oculto si ya hay datos) -->
    <div id="configSection">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="margin: 0 0 8px; font-size: 20px; color: var(--text-main); font-weight: 500;">Configurar Dispositivo</h2>
        <p style="margin: 0; color: var(--text-muted); font-size: 14px;">Ingresa tus datos para comenzar</p>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" class="form-input" placeholder="Ej. Juan Pérez" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="sucursal">Selecciona tu Clínica</label>
        <select id="sucursal" class="form-input">
          <option value="">-- Elige una opción --</option>
          <option value="Tijuana">Tijuana</option>
          <option value="Ensenada">Ensenada</option>
          <option value="Mexicali - Obregón">Mexicali - Obregón</option>
          <option value="Mexicali - Villa Verde">Mexicali - Villa Verde</option>
        </select>
      </div>
      <button class="btn-guardar" onclick="guardarConfiguracion()">Guardar y Continuar</button>
    </div>

    <!-- Paso 2: Reloj Checador (Visible si ya hay datos) -->
    <div class="user-badge" id="userBadge" style="display: none;">
      <div class="user-badge-info">
        <p style="font-size: 16px; margin: 0 0 4px; color: var(--text-muted);">¡Hola,</p>
        <h1 id="badgeNombre" style="font-size: 26px; line-height: 1.2; margin: 0;"></h1>
        <p id="badgeSucursal" style="margin: 6px 0 0; color: var(--text-light); font-size: 14px;"></p>
      </div>
      <button class="btn-settings-outline" onclick="mostrarConfiguracion()" title="Cambiar Sucursal o Usuario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>

    <div id="punchSection" style="display: none; margin-top: 32px;">
      <p style="text-align: center; color: var(--text-light); margin-bottom: 24px; font-size: 14px;">¿Qué deseas registrar en este momento?</p>
      <div class="punch-grid">
        <button class="btn-punch btn-entrada" id="btnEntrada" onclick="registrar('Entrada')">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          Entrada
          <span>Al llegar a tu turno</span>
        </button>
        
        <button class="btn-punch btn-salida" id="btnSalida" onclick="registrar('Salida')">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          Salida
          <span>Al terminar tu turno</span>
        </button>
      </div>
    </div>
    
  </div>
</div>

<!-- Modal de Éxito -->
<div id="successModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <div class="modal-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h2 id="modalTitle" class="modal-title">¡Registro Exitoso!</h2>
    <p id="modalMessage" class="modal-message" style="margin-bottom: 0;"></p>
  </div>
</div>

<script>
  // TEMA OSCURO
  const KEY_THEME = 'dmf_theme';
  const sunSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  function aplicarTema() {
    const isDark = localStorage.getItem(KEY_THEME) === 'dark';
    const btnTheme = document.getElementById('btnThemeToggle');
    if (isDark) {
      document.body.classList.add('dark-theme');
      btnTheme.innerHTML = sunSvg;
    } else {
      document.body.classList.remove('dark-theme');
      btnTheme.innerHTML = moonSvg;
    }
  }

  function toggleTheme() {
    const isDark = document.body.classList.contains('dark-theme');
    localStorage.setItem(KEY_THEME, isDark ? 'light' : 'dark');
    aplicarTema();
  }

  aplicarTema();

  // Fecha UI
  const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
  let fechaFormat = new Date().toLocaleDateString('es-MX', opciones);
  document.getElementById('fechaHoy').textContent = "Hoy: " + fechaFormat.charAt(0).toUpperCase() + fechaFormat.slice(1);

  const API_URL = "https://script.google.com/macros/s/AKfycbw-Yw0IHg7MCInYfncbsnHfXmTsE8tWFVVONc_gjmpmuz6OM7o9meYbbFSliAoZo9FRmA/exec";

  function cargarDatosGuardados() {
    const nombre = localStorage.getItem('dmf_nombre');
    const sucursal = localStorage.getItem('dmf_sucursal');
    if (nombre && sucursal) {
      document.getElementById('configSection').classList.add('display-none');
      document.getElementById('badgeNombre').textContent = nombre;
      document.getElementById('badgeSucursal').textContent = sucursal;
      document.getElementById('userBadge').style.display = 'flex';
      document.getElementById('punchSection').style.display = 'block';
    } else {
      mostrarConfiguracion();
    }
  }

  function mostrarConfiguracion() {
    document.getElementById('configSection').classList.remove('display-none');
    document.getElementById('userBadge').style.display = 'none';
    document.getElementById('punchSection').style.display = 'none';
    document.getElementById('nombre').value = localStorage.getItem('dmf_nombre') || '';
    document.getElementById('sucursal').value = localStorage.getItem('dmf_sucursal') || '';
  }

  function guardarConfiguracion() {
    const nombre = document.getElementById('nombre').value.trim();
    const sucursal = document.getElementById('sucursal').value;
    if (!nombre || !sucursal) {
      alert("Por favor completa tu nombre y elige una clínica.");
      return;
    }
    localStorage.setItem('dmf_nombre', nombre);
    localStorage.setItem('dmf_sucursal', sucursal);
    cargarDatosGuardados();
  }

  function showModal(isEntrada) {
    const overlay = document.getElementById('successModal');
    const msg = document.getElementById('modalMessage');
    
    if (isEntrada) {
      msg.textContent = "Que tengas muy buen turno, excelente día.";
    } else {
      msg.textContent = "Muchas gracias por tu trabajo, que tengas buen día.";
    }
    
    overlay.style.display = 'flex';
    setTimeout(() => overlay.classList.add('show'), 10);

    // Auto-cerrar después de 3.5 segundos
    setTimeout(() => {
      closeModal();
    }, 3500);
  }

  function closeModal() {
    const overlay = document.getElementById('successModal');
    overlay.classList.remove('show');
    setTimeout(() => overlay.style.display = 'none', 300);
  }

  async function registrar(tipo) {
    const nombre = localStorage.getItem('dmf_nombre');
    const sucursal = localStorage.getItem('dmf_sucursal');
    if (!nombre || !sucursal) return;

    const btnEntrada = document.getElementById('btnEntrada');
    const btnSalida = document.getElementById('btnSalida');
    const isEntrada = tipo === 'Entrada';
    
    const originalHtml = isEntrada ? btnEntrada.innerHTML : btnSalida.innerHTML;
    const loaderHtml = `<svg class="spinner" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Registrando...`;

    if(isEntrada) {
      btnEntrada.disabled = true;
      btnEntrada.innerHTML = loaderHtml;
    } else {
      btnSalida.disabled = true;
      btnSalida.innerHTML = loaderHtml;
    }

    try {
      const now = new Date();
      
      // Formatear Fecha a DD/MM/YYYY
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      const fechaStr = `${d}/${m}/${y}`;

      // Formatear Hora a HH:MM a.m./p.m.
      let hours = now.getHours();
      let mins = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'p.m.' : 'a.m.';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const horaStr = `${String(hours).padStart(2, '0')}:${mins} ${ampm}`;

      const qs = new URLSearchParams({
        action: 'registrar',
        nombre: nombre,
        sucursal: sucursal,
        tipo: tipo,
        fecha: fechaStr,
        hora: horaStr
      });

      // No-cors fetch as configured earlier to avoid CORS bounce from Google login
      await fetch(API_URL + '?' + qs.toString(), { mode: 'no-cors' });

      // Ocultar spinners
      if(isEntrada) {
        btnEntrada.disabled = false;
        btnEntrada.innerHTML = originalHtml;
      } else {
        btnSalida.disabled = false;
        btnSalida.innerHTML = originalHtml;
      }

      // Mostrar mensaje custom
      showModal(isEntrada);

    } catch (error) {
      console.error(error);
      alert("Ocurrió un error de red. Por favor intenta de nuevo.");
      
      if(isEntrada) {
        btnEntrada.disabled = false;
        btnEntrada.innerHTML = originalHtml;
      } else {
        btnSalida.disabled = false;
        btnSalida.innerHTML = originalHtml;
      }
    }
  }

  // Init
  cargarDatosGuardados();

</script>
</body>
</html>
