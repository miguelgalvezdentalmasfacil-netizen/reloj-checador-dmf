<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reloj Checador · Dental Más Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Variables de Color (Tema Claro por defecto) */
  :root {
    --bg-color: #F4F7F9;
    --surface: #FFFFFF;
    --text-main: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --primary: #1D4ED8; 
    --primary-hover: #1E40AF;
    --primary-btn-bg: #0c3b5e;
    --primary-btn-hover: #082a45;
    --teal: #0D9488;
    --teal-light: #CCFBF1;
    --green: #10B981;
    --red: #EF4444;
    --input-bg: #F8FAFC;
    --icon-bg: #EFF6FF;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius-lg: 32px;
    --radius-md: 16px; 
    --hover-ent: #ECFDF5;
    --hover-sal: #FEF2F2;
  }

  /* Tema Oscuro */
  body.dark-theme {
    --bg-color: #0F172A;
    --surface: #1E293B;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border: #334155;
    --input-bg: #0B1120;
    --icon-bg: #0F172A;
    --teal-light: #134E4A;
    --teal: #2DD4BF;
    --primary-btn-bg: #3B82F6;
    --primary-btn-hover: #2563EB;
    --hover-ent: rgba(16, 185, 129, 0.1);
    --hover-sal: rgba(239, 68, 68, 0.1);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color 0.3s, color 0.3s;
  }
  
  /* Navbar */
  .navbar {
    background: var(--surface);
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 10;
    transition: background-color 0.3s, border-color 0.3s;
  }
  
  /* Logo en Alta Definición (Reconstruido con CSS para colores perfectos y cero padding blanco) */
  .brand { 
    display: flex; 
    align-items: center; 
  }
  .dmf-logo {
    display: flex; flex-direction: column; justify-content: center; user-select: none;
  }
  .dmf-logo-top {
    font-size: 26px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center;
  }
  .dmf-dental { color: #52525B; }
  .dmf-cross { color: #00A3B5; font-size: 25px; margin: 0 3px; }
  .dmf-facil { color: #00A3B5; }
  .dmf-logo-bottom {
    font-size: 9px; font-weight: 700; color: #71717A; letter-spacing: 0.22em; margin-top: -3px;
  }
  /* Adaptación del logo en modo oscuro */
  body.dark-theme .dmf-dental { color: #F4F4F5; }
  body.dark-theme .dmf-logo-bottom { color: #A1A1AA; }

  /* Menú de Opciones (Nav Actions) */
  .nav-actions { position: relative; margin-left: auto; }
  .btn-icon-top {
    background: transparent; border: none; font-size: 22px; cursor: pointer;
    color: var(--text-muted); padding: 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .btn-icon-top:hover { background: var(--input-bg); color: var(--text-main); }
  
  .dropdown-menu {
    position: absolute; right: 0; top: 50px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-md); min-width: 220px; z-index: 100;
    overflow: hidden;
    transform-origin: top right; transition: opacity 0.2s, transform 0.2s;
  }
  .dropdown-menu.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
  
  .dropdown-header {
    padding: 12px 16px; font-size: 11px; font-weight: 700; color: var(--text-muted); 
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); 
    background: var(--bg-color);
  }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: none;
    background: var(--surface); color: var(--text-main); font-size: 14px; font-weight: 500; 
    cursor: pointer; text-align: left; font-family: inherit; transition: background 0.1s;
  }
  .dropdown-item:hover { background: var(--input-bg); }
  .dropdown-divider { height: 1px; background: var(--border); }
  .text-red { color: var(--red); }

  /* Layout */
  .container {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 30px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
    transition: background-color 0.3s, border-color 0.3s;
  }

  .card-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .card-icon {
    background: var(--icon-bg);
    color: var(--primary);
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .card-title-group h2 {
    margin: 0; font-size: 18px; font-weight: 700; color: var(--text-main);
  }
  .card-title-group p {
    margin: 4px 0 0; font-size: 14px; color: var(--text-muted);
  }

  /* Forms */
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 15px;
    color: var(--text-main);
    font-family: inherit;
    transition: all 0.2s;
  }
  .form-control:focus {
    outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
  }

  select.form-control {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 24px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px;
    cursor: pointer; transition: all 0.2s; border: none; font-family: inherit; width: 100%;
  }
  .btn-primary {
    background: var(--primary-btn-bg); color: white;
  }
  .btn-primary:hover { background: var(--primary-btn-hover); }

  .btn-text {
    background: none; color: var(--text-muted); font-size: 14px; width: auto; padding: 14px 16px;
    text-decoration: underline; text-underline-offset: 4px; border: none; cursor: pointer; font-family: inherit;
  }
  .btn-text:hover { color: var(--text-main); }

  /* Punch View Specifics */
  .user-badge {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .user-badge-info h1 {
    margin: 0 0 8px 0; font-size: 26px; font-weight: 700; color: var(--text-main);
  }
  .user-badge-info .sucursal-tag {
    display: inline-block; background: var(--teal-light); color: var(--teal);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
  }

  .punch-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 500px) {
    .punch-grid { grid-template-columns: 1fr; }
  }

  .btn-punch {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; border-radius: var(--radius-lg); border: 2px solid transparent;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.2s, background 0.2s; background: var(--surface);
    font-family: inherit;
  }
  .btn-punch:active { transform: scale(0.97); }
  
  .btn-punch.entrada {
    border-color: var(--green); box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.15);
  }
  .btn-punch.entrada:hover { background: var(--hover-ent); }
  
  .btn-punch.salida {
    border-color: var(--red); box-shadow: 0 8px 20px -5px rgba(239, 68, 68, 0.15);
  }
  .btn-punch.salida:hover { background: var(--hover-sal); }

  .punch-icon { font-size: 32px; margin-bottom: 12px; }
  .punch-label { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
  .punch-sub { font-size: 13px; color: var(--text-muted); }

  .status-message {
    margin-top: 24px; padding: 16px; border-radius: var(--radius-md);
    text-align: center; font-weight: 600; font-size: 15px; display: none;
  }
  .status-message.success { background: var(--hover-ent); color: var(--green); display: block; border: 1px solid var(--green); }
  
  /* Utilities */
  .display-none { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <!-- Logo reconstruido en código de Alta Definición (HD) -->
  <div class="brand">
    <div class="dmf-logo">
      <div class="dmf-logo-top">
        <span class="dmf-dental">Dental</span>
        <span class="dmf-cross">✚</span>
        <span class="dmf-facil">Fácil</span>
      </div>
      <div class="dmf-logo-bottom">TU CONEXIÓN A LA SALUD</div>
    </div>
  </div>
  
  <!-- Engranaje en la esquina superior -->
  <div class="nav-actions">
    <button class="btn-icon-top" id="btnSettings" onclick="toggleMenu()" title="Configuración">⚙️</button>
    <div id="settingsMenu" class="dropdown-menu hidden">
      <div class="dropdown-header">Opciones de la App</div>
      <button class="dropdown-item" onclick="editarUsuario()"><span>👤</span> Editar usuario</button>
      <button class="dropdown-item" id="btnTheme" onclick="toggleTheme()"><span>🌙</span> Modo oscuro</button>
      <button class="dropdown-item" onclick="mostrarAyuda()"><span>❓</span> Ayuda y soporte</button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item text-red" onclick="cerrarSesion()"><span>🚪</span> Cerrar sesión</button>
    </div>
  </div>
</nav>

<div class="container">
  
  <!-- VISTA: SETUP/EDITAR USUARIO -->
  <div id="view-setup" class="card display-none">
    <div class="card-header">
      <div class="card-icon">👤</div>
      <div class="card-title-group">
        <h2 id="setupTitle">Crear perfil de empleado</h2>
        <p id="setupDesc">Solo necesitas configurar esto la primera vez.</p>
      </div>
    </div>
    
    <div class="form-group">
      <label>Nombre completo *</label>
      <input type="text" id="inputNombre" class="form-control" placeholder="Escribe tu nombre y apellido" autocomplete="off">
    </div>
    
    <div class="form-group">
      <label>Sucursal *</label>
      <select id="inputSucursal" class="form-control">
        <option value="">Selecciona una sucursal</option>
        <option value="Tijuana">Tijuana</option>
        <option value="Mexicali - Obregón">Mexicali - Obregón</option>
        <option value="Mexicali - Villa Verde">Mexicali - Villa Verde</option>
        <option value="Ensenada">Ensenada</option>
      </select>
    </div>
    
    <div style="display: flex; gap: 12px; align-items: center; margin-top: 10px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="guardarUsuario()">Guardar perfil</button>
      <button class="btn-text display-none" id="btnCancelar" onclick="cancelarEdicion()">Cancelar</button>
    </div>
  </div>


  <!-- VISTA: RELOJ CHECADOR -->
  <div id="view-punch" class="card display-none">
    <!-- El usuario y sucursal están centrados -->
    <div class="user-badge">
      <div class="user-badge-info">
        <h1 id="lblNombre">Cargando...</h1>
        <div class="sucursal-tag" id="lblSucursal">Sucursal</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 24px;">
      <p style="color: var(--text-muted); font-size: 14px; margin: 0;">¿Qué deseas registrar en este momento?</p>
    </div>

    <div class="punch-grid">
      <button class="btn-punch entrada" onclick="registrar('Entrada')">
        <div class="punch-icon">☀️</div>
        <div class="punch-label">Entrada</div>
        <div class="punch-sub">Al llegar a tu turno</div>
      </button>
      
      <button class="btn-punch salida" onclick="registrar('Salida')">
        <div class="punch-icon">🌙</div>
        <div class="punch-label">Salida</div>
        <div class="punch-sub">Al terminar tu turno</div>
      </button>
    </div>

    <div id="msgStatus" class="status-message"></div>
  </div>

</div>

<script>
  // Variables globales
  const KEY_USER = 'dmf_emp_nombre';
  const KEY_BRANCH = 'dmf_emp_sucursal';
  const KEY_THEME = 'dmf_theme';
  
  // Elementos DOM
  const viewSetup = document.getElementById('view-setup');
  const viewPunch = document.getElementById('view-punch');
  const inputNombre = document.getElementById('inputNombre');
  const inputSucursal = document.getElementById('inputSucursal');
  const lblNombre = document.getElementById('lblNombre');
  const lblSucursal = document.getElementById('lblSucursal');
  const msgStatus = document.getElementById('msgStatus');
  const settingsMenu = document.getElementById('settingsMenu');
  const btnCancelar = document.getElementById('btnCancelar');

  // Inicialización principal
  function init() {
    aplicarTema();

    const savedName = localStorage.getItem(KEY_USER);
    const savedBranch = localStorage.getItem(KEY_BRANCH);

    if (savedName && savedBranch) {
      lblNombre.textContent = savedName;
      lblSucursal.textContent = savedBranch;
      viewPunch.classList.remove('display-none');
      viewSetup.classList.add('display-none');
    } else {
      document.getElementById('setupTitle').textContent = "Crear perfil de empleado";
      document.getElementById('setupDesc').textContent = "Solo necesitas configurar esto la primera vez.";
      btnCancelar.classList.add('display-none'); 
      viewSetup.classList.remove('display-none');
      viewPunch.classList.add('display-none');
    }
  }

  /* ====== LÓGICA DEL MENÚ SUPERIOR ====== */
  function toggleMenu() {
    settingsMenu.classList.toggle('hidden');
  }

  // Cerrar menú si se hace clic afuera
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-actions')) {
      settingsMenu.classList.add('hidden');
    }
  });

  /* ====== TEMA OSCURO / CLARO ====== */
  function aplicarTema() {
    const isDark = localStorage.getItem(KEY_THEME) === 'dark';
    const btnTheme = document.getElementById('btnTheme');
    
    if (isDark) {
      document.body.classList.add('dark-theme');
      btnTheme.innerHTML = '<span>☀️</span> Modo claro';
    } else {
      document.body.classList.remove('dark-theme');
      btnTheme.innerHTML = '<span>🌙</span> Modo oscuro';
    }
  }

  function toggleTheme() {
    const isDark = document.body.classList.contains('dark-theme');
    localStorage.setItem(KEY_THEME, isDark ? 'light' : 'dark');
    aplicarTema();
    toggleMenu(); // Cierra el menú al hacer clic
  }

  /* ====== FUNCIONES DEL PERFIL ====== */
  function guardarUsuario() {
    const nombre = inputNombre.value.trim();
    const sucursal = inputSucursal.value;

    if (!nombre) { alert("Por favor, escribe tu nombre completo."); return; }
    if (!sucursal) { alert("Por favor, selecciona una sucursal."); return; }

    localStorage.setItem(KEY_USER, nombre);
    localStorage.setItem(KEY_BRANCH, sucursal);
    
    msgStatus.className = 'status-message';
    init();
  }

  function editarUsuario() {
    inputNombre.value = localStorage.getItem(KEY_USER) || '';
    inputSucursal.value = localStorage.getItem(KEY_BRANCH) || '';
    
    document.getElementById('setupTitle').textContent = "Editar perfil";
    document.getElementById('setupDesc').textContent = "Actualiza tu nombre o cambia de sucursal.";
    
    btnCancelar.classList.remove('display-none');
    
    viewPunch.classList.add('display-none');
    viewSetup.classList.remove('display-none');
    toggleMenu();
  }

  function cancelarEdicion() {
    init();
  }

  function cerrarSesion() {
    if(confirm("¿Seguro que deseas cerrar sesión? Borrará tus datos de este dispositivo.")){
      localStorage.removeItem(KEY_USER);
      localStorage.removeItem(KEY_BRANCH);
      inputNombre.value = '';
      inputSucursal.value = '';
      msgStatus.className = 'status-message';
      init();
    }
    toggleMenu();
  }

  function mostrarAyuda() {
    alert("Soporte: Para cualquier problema con el reloj checador, contacta al administrador o a Recursos Humanos de Dental Más Fácil.");
    toggleMenu();
  }

  /* ====== LÓGICA DEL RELOJ ====== */
  function registrar(tipo) {
    const now = new Date();
    const timeString = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    
    msgStatus.textContent = `¡${tipo} registrada exitosamente a las ${timeString}!`;
    msgStatus.className = 'status-message success';

    setTimeout(() => {
      msgStatus.className = 'status-message';
    }, 5000);

    // LOG PARA FUTURA INTEGRACIÓN
    console.log(`[BD] ${tipo} | Empleado: ${lblNombre.textContent} | Sucursal: ${lblSucursal.textContent} | Hora: ${timeString}`);
  }

  // Iniciar la app
  init();
</script>

</body>
</html>
