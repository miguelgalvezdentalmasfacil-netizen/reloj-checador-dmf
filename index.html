<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reloj Checador · Dental Más Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #F4F7F9;
    --surface: #FFFFFF;
    --text-main: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --primary: #1D4ED8; /* Blue */
    --primary-hover: #1E40AF;
    --teal: #0D9488;
    --teal-light: #CCFBF1;
    --green: #10B981;
    --red: #EF4444;
    --input-bg: #F8FAFC;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius-lg: 16px;
    --radius-md: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  
  /* Navbar */
  .navbar {
    background: var(--surface);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-cross {
    color: var(--teal); font-size: 24px; font-weight: 800;
  }
  .logo-text-wrapper { display: flex; flex-direction: column; }
  .logo-title {
    font-size: 18px; font-weight: 800; color: #0c3b5e; letter-spacing: -0.5px; margin-bottom: -2px;
  }
  .logo-title span { color: var(--teal); }
  .logo-subtitle {
    font-size: 9px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
  }

  /* Layout */
  .container {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 30px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .card-icon {
    background: #EFF6FF;
    color: var(--primary);
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .card-title-group h2 {
    margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main);
  }
  .card-title-group p {
    margin: 4px 0 0; font-size: 13px; color: var(--text-muted);
  }

  /* Forms */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 15px;
    color: var(--text-main);
    font-family: inherit;
    transition: all 0.2s;
  }
  .form-control:focus {
    outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
  }

  select.form-control {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 24px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px;
    cursor: pointer; transition: all 0.2s; border: none; font-family: inherit; width: 100%;
  }
  .btn-primary {
    background: #0c3b5e; color: white;
  }
  .btn-primary:hover { background: #082a45; }
  
  .btn-icon {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: var(--text-muted); padding: 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .btn-icon:hover { background: #F1F5F9; }

  /* Punch View Specifics */
  .user-badge {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .user-badge-info h1 {
    margin: 0 0 6px 0; font-size: 22px; font-weight: 700; color: #0c3b5e;
  }
  .user-badge-info .sucursal-tag {
    display: inline-block; background: var(--teal-light); color: var(--teal);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700;
  }

  .punch-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 500px) {
    .punch-grid { grid-template-columns: 1fr; }
  }

  .btn-punch {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; border-radius: var(--radius-lg); border: 2px solid transparent;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; background: var(--surface);
    font-family: inherit;
  }
  .btn-punch:active { transform: scale(0.97); }
  
  .btn-punch.entrada {
    border-color: var(--green); box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.15);
  }
  .btn-punch.entrada:hover { background: #ECFDF5; }
  
  .btn-punch.salida {
    border-color: var(--red); box-shadow: 0 8px 20px -5px rgba(239, 68, 68, 0.15);
  }
  .btn-punch.salida:hover { background: #FEF2F2; }

  .punch-icon { font-size: 32px; margin-bottom: 12px; }
  .punch-label { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
  .punch-sub { font-size: 13px; color: var(--text-muted); }

  .status-message {
    margin-top: 24px; padding: 16px; border-radius: var(--radius-md);
    text-align: center; font-weight: 600; font-size: 15px; display: none;
  }
  .status-message.success { background: #ECFDF5; color: #047857; display: block; }
  
  /* Utilities */
  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <div class="logo-cross">✚</div>
    <div class="logo-text-wrapper">
      <div class="logo-title">Dental<span>+</span>Fácil</div>
      <div class="logo-subtitle">Tu conexión a la salud</div>
    </div>
  </div>
</nav>

<div class="container">
  
  <!-- VISTA: SETUP/EDITAR USUARIO -->
  <div id="view-setup" class="card hidden">
    <div class="card-header">
      <div class="card-icon">👤</div>
      <div class="card-title-group">
        <h2 id="setupTitle">Crear perfil de empleado</h2>
        <p id="setupDesc">Solo necesitas configurar esto la primera vez.</p>
      </div>
    </div>
    
    <div class="form-group">
      <label>Nombre completo *</label>
      <input type="text" id="inputNombre" class="form-control" placeholder="Escribe tu nombre y apellido" autocomplete="off">
    </div>
    
    <div class="form-group">
      <label>Sucursal *</label>
      <select id="inputSucursal" class="form-control">
        <option value="">Selecciona una sucursal</option>
        <option value="Tijuana">Tijuana</option>
        <option value="Mexicali - Obregón">Mexicali - Obregón</option>
        <option value="Mexicali - Villa Verde">Mexicali - Villa Verde</option>
        <option value="Ensenada">Ensenada</option>
      </select>
    </div>
    
    <button class="btn btn-primary" onclick="guardarUsuario()">Guardar perfil</button>
  </div>


  <!-- VISTA: RELOJ CHECADOR -->
  <div id="view-punch" class="card hidden">
    <div class="user-badge">
      <div class="user-badge-info">
        <h1 id="lblNombre">Cargando...</h1>
        <div class="sucursal-tag" id="lblSucursal">Sucursal</div>
      </div>
      <button class="btn-icon" onclick="editarUsuario()" title="Editar perfil">⚙️</button>
    </div>

    <div style="text-align: center; margin-bottom: 24px;">
      <p style="color: var(--text-muted); font-size: 14px; margin: 0;">¿Qué deseas registrar en este momento?</p>
    </div>

    <div class="punch-grid">
      <button class="btn-punch entrada" onclick="registrar('Entrada')">
        <div class="punch-icon">☀️</div>
        <div class="punch-label">Entrada</div>
        <div class="punch-sub">Al llegar a tu turno</div>
      </button>
      
      <button class="btn-punch salida" onclick="registrar('Salida')">
        <div class="punch-icon">🌙</div>
        <div class="punch-label">Salida</div>
        <div class="punch-sub">Al terminar tu turno</div>
      </button>
    </div>

    <div id="msgStatus" class="status-message"></div>
  </div>

</div>

<script>
  // Variables globales
  const KEY_USER = 'dmf_emp_nombre';
  const KEY_BRANCH = 'dmf_emp_sucursal';
  
  // Elementos DOM
  const viewSetup = document.getElementById('view-setup');
  const viewPunch = document.getElementById('view-punch');
  const inputNombre = document.getElementById('inputNombre');
  const inputSucursal = document.getElementById('inputSucursal');
  const lblNombre = document.getElementById('lblNombre');
  const lblSucursal = document.getElementById('lblSucursal');
  const msgStatus = document.getElementById('msgStatus');

  // Inicialización
  function init() {
    const savedName = localStorage.getItem(KEY_USER);
    const savedBranch = localStorage.getItem(KEY_BRANCH);

    if (savedName && savedBranch) {
      // Usuario existe, mostrar panel de botones
      lblNombre.textContent = savedName;
      lblSucursal.textContent = savedBranch;
      viewPunch.classList.remove('hidden');
      viewSetup.classList.add('hidden');
    } else {
      // Nuevo usuario, mostrar setup en modo creacion
      document.getElementById('setupTitle').textContent = "Crear perfil de empleado";
      document.getElementById('setupDesc').textContent = "Solo necesitas configurar esto la primera vez.";
      viewSetup.classList.remove('hidden');
      viewPunch.classList.add('hidden');
    }
  }

  // Guardar perfil (creación o edición)
  function guardarUsuario() {
    const nombre = inputNombre.value.trim();
    const sucursal = inputSucursal.value;

    if (!nombre) { alert("Por favor, escribe tu nombre completo."); return; }
    if (!sucursal) { alert("Por favor, selecciona una sucursal."); return; }

    localStorage.setItem(KEY_USER, nombre);
    localStorage.setItem(KEY_BRANCH, sucursal);
    
    msgStatus.className = 'status-message'; // reset message
    init();
  }

  // Editar perfil (en lugar de solo borrarlo)
  function editarUsuario() {
    // Pre-llenar los campos con lo que ya tiene guardado
    inputNombre.value = localStorage.getItem(KEY_USER) || '';
    inputSucursal.value = localStorage.getItem(KEY_BRANCH) || '';
    
    // Cambiar los textos para que se entienda que está editando
    document.getElementById('setupTitle').textContent = "Editar perfil";
    document.getElementById('setupDesc').textContent = "Actualiza tu nombre o cambia de sucursal.";
    
    // Cambiar de vista
    viewPunch.classList.add('hidden');
    viewSetup.classList.remove('hidden');
  }

  // Registrar asistencia inteligentemente
  function registrar(tipo) {
    const now = new Date();
    const timeString = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    
    msgStatus.textContent = `¡${tipo} registrada exitosamente a las ${timeString}!`;
    msgStatus.className = 'status-message success';

    setTimeout(() => {
      msgStatus.className = 'status-message';
    }, 5000);

    // [INTEGRACIÓN FUTURA CON GOOGLE SHEETS]
    console.log(`Guardando en base de datos: ${tipo} | Empleado: ${lblNombre.textContent} | Hora: ${timeString}`);
  }

  // Arrancar la app al cargar la página
  init();
</script>

</body>
</html>
